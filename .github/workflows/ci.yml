name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Test
        run: pytest
      - name: Build package
        run: |
          pip install build
          python -m build

  browser:
    # opens a generated map in headless Chromium: catches JavaScript errors
    # and popup charts that fail to draw, which the unit tests cannot see
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test] playwright
          playwright install --with-deps chromium
      - name: Browser test
        env:
          GPX_VIS_REQUIRE_BROWSER: "1"
        run: pytest tests/test_browser.py -v
